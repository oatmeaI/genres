<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{% block title %}Plex genres{% endblock %}</title>
  <meta name="theme-color" content="#0f1218">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chips.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/albums.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/autocomplete.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/genre-editor.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>
<body>
  <header>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ url_for('index') }}">Albums</a>
      <a href="{{ url_for('genres_editor') }}">Edit genres list</a>
      <a href="{{ url_for('history', filter=1) }}">Play history</a>
      <a href="{{ url_for('incomplete') }}">Incomplete albums</a>
      <a href="{{ url_for('upgrade', bitrate=192) }}">Upgradeable albums</a>
      <a href="{{ url_for('played_ratio') }}">Stats</a>
      <a href="{{ url_for('update') }}">Update Collections</a>
      <a href="{{ url_for('sync_collection_genre') }}">Sync Collection -> Genre (Collection as source of truth)</a>
      <a href="{{ url_for('sync_genre_collection') }}">Sync Genre -> Collection</a>
    </nav>
    <h1>{% block heading %}Plex genres{% endblock %}</h1>
    {% block subheading %}{% endblock %}
  </header>

  <main>
    {% block body %}{% endblock %}
  </main>

  <script type="application/json" id="genre-hints">{{ genre_hints_json|safe }}</script>
  <script src="{{ url_for('static', filename='js/genre-chips.js') }}"></script>
  <script src="{{ url_for('static', filename='js/genre-autocomplete.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
</body>
</html>
