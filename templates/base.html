<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Plex genres{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #171b24;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #6c9fff;
      --border: #2a3142;
      --error: #ff8a8a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 650; }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    main { padding: 1.25rem 1.5rem 2.5rem; max-width: 960px; margin: 0 auto; width: 100%; }
    code { background: #252a38; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.65rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--muted); font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #252a38; }
    .artist { font-size: 0.85rem; color: var(--muted); }
    .album-title { font-weight: 600; }
    .genre-form { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .genre-form input:not([type="hidden"]) {
      flex: 1 1 140px;
      /* min-width: 120px; */
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #12151c;
      color: var(--text);
    }
    .genre-form button {
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #0a0e14;
      font-weight: 600;
      cursor: pointer;
    }
    .genre-form button:hover { filter: brightness(1.08); }
    .genre-form.htmx-request button { opacity: 0.6; cursor: wait; }
    .genre-form input[type="hidden"] { display: none; }
    .genre-editor {}
    .chip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; padding: 5px 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; flex: 1 1 auto; min-height: 2rem; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.45rem 0.2rem 0.55rem;
      border-radius: 999px;
      background: #252a38;
      border: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .chip-x {
      margin: 0;
      padding: 0 0.15rem;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      border-radius: 4px;
    }
    .chip-x:hover { color: var(--text); background: #3a4154; }
    .genre-add-row { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
    .genre-add-input {
      flex: 1 1 120px;
      min-width: 0;
      max-width: 100%;
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #12151c;
      color: var(--text);
    }
    button.secondary {
      padding: 0.4rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #252a38;
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
    }
    button.secondary:hover { filter: brightness(1.06); }
    .row-error { color: var(--error); font-size: 0.82rem; margin-top: 0.35rem; }
    .row-note { color: #c9b87a; font-size: 0.82rem; margin-top: 0.35rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: flex-end;
      margin-top: 0.5rem;
    }
    .toolbar label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; color: var(--muted); }
    .toolbar select,
    .toolbar input[type="search"],
    .toolbar input[type="text"] {
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #12151c;
      color: var(--text);
      min-width: 0;
      width: 100%;
      max-width: 100%;
    }
    .toolbar input[type="search"] { min-width: 12rem; }
    .toolbar button,
    .toolbar-clear {
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #252a38;
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.5rem;
    }
    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .pager { margin-top: 1.25rem; display: flex; gap: 1rem; align-items: center; color: var(--muted); }
    .pager a { color: var(--accent); text-decoration: none; }
    .pager a:hover { text-decoration: underline; }
    .banner { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .banner.error { background: #2a1a1a; border: 1px solid #5a3030; color: var(--error); }
    .banner.warn { background: #2a2618; border: 1px solid #5a5230; color: #e8d9a8; }
    .album-stats { color: var(--muted); font-size: 0.9rem; margin: 0.65rem 0 0.35rem; line-height: 1.5; }
    .album-stats .stat-tag { color: var(--muted); font-weight: 400; }
    .toolbar-check { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: var(--text); cursor: pointer; }
    .toolbar-check input { width: auto; cursor: pointer; }
    .genre-create {
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    .genre-create-heading {
      margin: 0 0 0.5rem;
      width: 100%;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .genre-create input[type="text"] {
      min-width: 0;
      width: 100%;
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #12151c;
      color: var(--text);
    }
    .genre-autocomplete-wrap { position: relative; }
    .genre-autocomplete-menu {
      position: fixed;
      z-index: 1000;
      max-height: 240px;
      overflow-y: auto;
      margin: 0;
      padding: 0.25rem 0;
      list-style: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .genre-autocomplete-item {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      padding: 0.45rem 0.65rem;
      cursor: pointer;
    }
    .genre-autocomplete-item:hover,
    .genre-autocomplete-item.is-active {
      background: #252a38;
    }
    .genre-autocomplete-name { font-size: 0.92rem; color: var(--text); }
    .genre-autocomplete-examples {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thumb-placeholder { display: inline-block; }
    .album-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      margin: 0.35rem 0;
      font-size: 0.85rem;
    }
    .album-links a { color: var(--accent); text-decoration: none; }
    .album-links a:hover { text-decoration: underline; }
    .album-lastfm-btn { margin-top: 0.35rem; }
    .form-check {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 0.35rem;
    }
    .form-check input { width: auto; min-width: 1rem; min-height: 1rem; cursor: pointer; }
    .save-btn { min-height: 2.5rem; }
    .album-table { margin-top: 1rem; }

    @media (max-width: 720px) {
      header { padding: 1rem; }
      header h1 { font-size: 1.2rem; }
      header p { font-size: 0.88rem; line-height: 1.5; }
      main { padding: 1rem 0.85rem 2rem; }

      input, select, textarea, button { font-size: 16px; }

      .toolbar,
      .genre-create {
        flex-direction: column;
        align-items: stretch;
      }
      .toolbar label,
      .genre-create label,
      .toolbar-check {
        width: 100%;
      }
      .toolbar-check {
        min-height: 2.75rem;
        padding: 0.15rem 0;
      }
      .toolbar-actions {
        width: 100%;
      }
      .toolbar-actions button,
      .toolbar-actions .toolbar-clear {
        flex: 1 1 auto;
      }
      .toolbar input[type="search"] { min-width: 0; }

      .album-stats { font-size: 0.85rem; }
      .pager {
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.5rem 1rem;
      }
      .pager a {
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
      }

      .album-table thead { display: none; }
      .album-table,
      .album-table tbody,
      .album-table tr,
      .album-table td {
        display: block;
        width: 100%;
      }
      .album-table tr.album-row {
        margin-bottom: 1rem;
        padding: 0.85rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
      }
      .album-table td {
        border: none;
        padding: 0;
      }
      .album-table td + td { margin-top: 0.75rem; }
      .album-table td[data-label]:not([data-label=""])::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.72rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .album-cell-thumb {
        display: flex;
        align-items: center;
        gap: 0;
        margin-bottom: 0.25rem;
      }
      .album-cell-thumb::before { display: none !important; }
      .album-cell-info .album-title { font-size: 1.05rem; }
      .genre-add-row { width: 100%; }
      .genre-add-input { flex: 1 1 auto; }
      .genre-add-btn,
      .album-lastfm-btn,
      .save-btn,
      .chip-x {
        min-height: 2.75rem;
        min-width: 2.75rem;
      }
      .save-btn { width: 100%; }
      .chip-x {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 0.5rem;
      }
      .genre-autocomplete-examples {
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
      }
    }

    @media (min-width: 721px) {
      .album-cell-info { width: 250px; max-width: 30vw; }
      .album-cell-actions { width: 200px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>{% block heading %}Plex genres{% endblock %}</h1>
    {% block subheading %}{% endblock %}
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
  <script type="application/json" id="genre-hints">{{ genre_hints_json|safe }}</script>
  <script>
  (function () {
    function editorRoot(el) {
      return el && el.closest ? el.closest('.genre-editor') : null;
    }
    function chipTags(chipsEl) {
      return Array.from(chipsEl.querySelectorAll('.chip')).map(function (c) {
        return c.getAttribute('data-tag') || '';
      }).filter(Boolean);
    }
    function syncHidden(root) {
      var h = root.querySelector('.genre-hidden-input');
      var chips = root.querySelector('.chips');
      if (h && chips) h.value = chipTags(chips).join(', ');
    }
    function addChip(root, rawTag) {
      var tag = rawTag.replace(/^\s+|\s+$/g, '');
      if (!tag) return;
      var chips = root.querySelector('.chips');
      if (!chips) return;
      var lower = tag.toLowerCase();
      var dup = Array.from(chips.querySelectorAll('.chip')).some(function (c) {
        return (c.getAttribute('data-tag') || '').toLowerCase() === lower;
      });
      if (dup) return;
      var span = document.createElement('span');
      span.className = 'chip';
      span.setAttribute('data-tag', tag);
      span.appendChild(document.createTextNode(tag + ' '));
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip-x';
      btn.setAttribute('aria-label', 'Remove ' + tag);
      btn.textContent = '\u00d7';
      span.appendChild(btn);
      chips.appendChild(span);
      syncHidden(root);
    }
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t.closest && t.closest('.chip-x')) {
        var chip = t.closest('.chip');
        var root = chip && editorRoot(chip);
        if (chip && root) {
          chip.remove();
          syncHidden(root);
        }
        return;
      }
      if (t.closest && t.closest('.genre-add-btn')) {
        var root = editorRoot(t.closest('.genre-add-btn'));
        if (!root) return;
        var inp = root.querySelector('.genre-add-input');
        if (inp) {
          addChip(root, inp.value);
          inp.value = '';
          inp.focus();
        }
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      if (!e.target.classList || !e.target.classList.contains('genre-add-input')) return;
      var root = editorRoot(e.target);
      if (!root) return;

      if (e.metaKey || e.ctrlKey) {
        e.preventDefault();
        syncHidden(root);
        var form = root.querySelector('form.genre-form');
        if (form) form.requestSubmit();
        return;
      }

      e.preventDefault();
      addChip(root, e.target.value);
      e.target.value = '';
    });

    document.body.addEventListener('htmx:beforeRequest', function (evt) {
      var elt = evt.detail && evt.detail.elt;
      if (!elt || !elt.classList || !elt.classList.contains('genre-form')) return;
      var root = editorRoot(elt);
      if (root) syncHidden(root);
    });

    var genreHints = [];
    try {
      var hintsEl = document.getElementById('genre-hints');
      if (hintsEl) genreHints = JSON.parse(hintsEl.textContent || '[]');
    } catch (err) {}

    var genreMenu = null;
    var genreMenuInput = null;
    var genreMenuItems = [];
    var genreMenuIndex = -1;

    function closeGenreMenu() {
      if (genreMenu) genreMenu.remove();
      genreMenu = null;
      genreMenuInput = null;
      genreMenuItems = [];
      genreMenuIndex = -1;
    }

    function positionGenreMenu(input) {
      if (!genreMenu) return;
      var rect = input.getBoundingClientRect();
      var margin = 8;
      var width = Math.max(Math.min(rect.width, window.innerWidth - margin * 2), 220);
      width = Math.min(width, window.innerWidth - margin * 2);
      var left = Math.max(margin, Math.min(rect.left, window.innerWidth - width - margin));
      var top = rect.bottom + 2;
      var maxHeight = Math.min(240, window.innerHeight - top - margin);
      if (maxHeight < 120) {
        top = Math.max(margin, rect.top - Math.min(240, rect.top - margin));
        maxHeight = Math.min(240, rect.top - margin * 2);
      }
      genreMenu.style.left = left + 'px';
      genreMenu.style.top = top + 'px';
      genreMenu.style.width = width + 'px';
      genreMenu.style.maxHeight = Math.max(maxHeight, 120) + 'px';
    }

    function setGenreMenuIndex(index) {
      if (!genreMenu) return;
      var rows = genreMenu.querySelectorAll('.genre-autocomplete-item');
      rows.forEach(function (row, i) {
        row.classList.toggle('is-active', i === index);
      });
      genreMenuIndex = index;
      if (index >= 0 && rows[index]) {
        rows[index].scrollIntoView({ block: 'nearest' });
      }
    }

    function pickGenreHint(input, hint) {
      input.value = hint.name;
      closeGenreMenu();
      input.focus();
    }

    function matchingGenreHints(query) {
      var q = query.replace(/^\s+|\s+$/g, '').toLowerCase();
      var matches = genreHints.filter(function (hint) {
        if (!q) return true;
        return hint.name.toLowerCase().indexOf(q) !== -1;
      });
      return matches.slice(0, 20);
    }

    function openGenreMenu(input, matches) {
      closeGenreMenu();
      if (!matches.length) return;

      genreMenuInput = input;
      genreMenuItems = matches;
      genreMenu = document.createElement('ul');
      genreMenu.className = 'genre-autocomplete-menu';
      genreMenu.setAttribute('role', 'listbox');

      matches.forEach(function (hint, index) {
        var li = document.createElement('li');
        li.className = 'genre-autocomplete-item';
        li.setAttribute('role', 'option');
        li.dataset.index = String(index);

        var name = document.createElement('span');
        name.className = 'genre-autocomplete-name';
        name.textContent = hint.name;
        li.appendChild(name);

        if (hint.examples && hint.examples.length) {
          var examples = document.createElement('span');
          examples.className = 'genre-autocomplete-examples';
          examples.textContent = hint.examples.join(', ');
          li.appendChild(examples);
        }

        li.addEventListener('mousedown', function (e) {
          e.preventDefault();
          pickGenreHint(input, hint);
        });
        genreMenu.appendChild(li);
      });

      document.body.appendChild(genreMenu);
      positionGenreMenu(input);
      genreMenuIndex = -1;
    }

    function refreshGenreMenu(input) {
      openGenreMenu(input, matchingGenreHints(input.value));
    }

    document.addEventListener('input', function (e) {
      if (!e.target.classList || !e.target.classList.contains('genre-autocomplete')) return;
      refreshGenreMenu(e.target);
    });

    document.addEventListener('focusin', function (e) {
      if (!e.target.classList || !e.target.classList.contains('genre-autocomplete')) return;
      refreshGenreMenu(e.target);
    });

    document.addEventListener('focusout', function (e) {
      if (!e.target.classList || !e.target.classList.contains('genre-autocomplete')) return;
      setTimeout(closeGenreMenu, 120);
    });

    document.addEventListener('keydown', function (e) {
      if (!genreMenu || !genreMenuInput || e.target !== genreMenuInput) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        setGenreMenuIndex(Math.min(genreMenuIndex + 1, genreMenuItems.length - 1));
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        setGenreMenuIndex(Math.max(genreMenuIndex - 1, 0));
        return;
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        closeGenreMenu();
        return;
      }
      if (e.key === 'Enter' && genreMenuIndex >= 0 && genreMenuItems[genreMenuIndex]) {
        e.preventDefault();
        e.stopPropagation();
        pickGenreHint(genreMenuInput, genreMenuItems[genreMenuIndex]);
      }
    }, true);

    window.addEventListener('resize', function () {
      if (genreMenuInput) positionGenreMenu(genreMenuInput);
    });
    window.addEventListener('scroll', function () {
      if (genreMenuInput) positionGenreMenu(genreMenuInput);
    }, true);
  })();
  </script>
</body>
</html>
